  <!-- Motyw ustawiany przed pierwszym renderem, żeby uniknąć białego mignięcia (FOUC) -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('hydraulik-dark-mode');
        var dark = saved !== null
          ? saved === 'true'
          : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) { /* localStorage niedostępny - zostaje motyw jasny */ }
    })();
  </script>
  <style>
    html { background-color: #FAFAFA; }
    html.dark { background-color: #1A1A1A; }
